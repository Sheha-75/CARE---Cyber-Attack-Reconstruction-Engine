############################################################
# APPLICATION
############################################################
spring.application.name=care-backend

############################################################
# SERVER
############################################################
server.port=8080

############################################################
# POSTGRESQL DATABASE
############################################################
spring.datasource.url=jdbc:postgresql://localhost:5432/care_db
spring.datasource.username=postgres
spring.datasource.password=Sheha
spring.datasource.driver-class-name=org.postgresql.Driver

############################################################
# JPA / HIBERNATE
############################################################
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

############################################################
# FILE UPLOAD
############################################################
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

############################################################
# CARE EVIDENCE STORAGE
############################################################
care.evidence.storage=uploads/evidence

############################################################
# JWT
############################################################
jwt.secret=jwt.secret=care_backend_jwt_secret_key_2026_super_secure_random_123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ
jwt.expiration=86400000

############################################################
# ERROR DETAILS
############################################################
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always

############################################################
# LOGGING
############################################################
logging.level.root=INFO
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.com.care=DEBUG